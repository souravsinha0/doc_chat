version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.0 # Pre-built image with pgvector
    restart: always
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: